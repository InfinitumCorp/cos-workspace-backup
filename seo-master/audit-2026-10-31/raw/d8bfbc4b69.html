{discount} off","Spaces.loadMorePages":"Load more","Spaces.relatedPages":"Related","Spaces.continueReading":"Continue reading","Spaces.mediaCollection.viewImages":"View","NoProductsData.description":"There are no products","NoProductsData.title":"Products","NoServicesData.title":"Services","NoServicesData.description":"There are no services","NoPriceListData.title":"Price List","NoPriceListData.description":"There are no price list","About.title":"About {count, plural, one {Me} other {Us}}","PriceListPage.title":"Price List","ContactUs.title":"Contact {count, plural, one {Me} other {Us}}","CallUs.title":"Call {count, plural, one {Me} other {Us}}","Home.title":"Home","Space.title":"Space","CustomHtml.previewLabelText":"This section can only be seen on your live site.","CustomHtml.previewLabelLink":"Click here to check it out!","CustomHTML.title":"Custom Code","system.string.setting":"{text}","Offerings.title":"Offerings","paypalField.invalid":"Invalid value.","menu.home":"Home","privacyPolicyExample":"This Privacy Policy describes how your personal information is collected, used, and shared when you visit or make a purchase from this website (the “Site”).\n\nPERSONAL INFORMATION WE COLLECT\n\nWhen you visit the Site, we may collect certain information about your device, including information about your web browser, IP address, time zone, and some of the cookies that are installed on your device.\n\nAdditionally, as you browse the Site, we collect information about the individual web pages or products that you view, what websites or search terms referred you to the Site, and information about how you interact with the Site. We refer to this automatically-collected information as “Browsing Information”.\n\nWe collect Browsing Information using the following technologies:\n\n– “Cookies” are data files that are placed on your device or computer and often include an anonymous unique identifier. For more information about cookies, and how to disable cookies, visit <a href='http://www.allaboutcookies.org' target='_blank'>http://www.allaboutcookies.org</a>.\n\n– “Log files” track actions occurring on the Site, and collect data including your IP address, browser type, Internet service provider, referring/exit pages, and date/time stamps.\n\n– “Web beacons”, “tags”, and “pixels” are electronic files used to record information about how you browse the Site.\n\nAdditionally when you make a purchase or attempt to make a purchase through the Site, we collect certain information from you, including your name, billing address, shipping address, payment information (including credit card numbers, email address, and phone number). We refer to this information as “Purchase Information”.\n\nWhen we talk about “Your Personal Information” in this Privacy Policy, we are talking both about Browsing Information and Purchase Information.\n\nHOW DO WE USE YOUR PERSONAL INFORMATION?\n\nWe use the Purchase Information that we collect generally to fulfill any orders placed through the Site (including processing your payment information, arranging for shipping, and providing you with invoices and/or order confirmations). Additionally, we use this Purchase Information to:\n\n– Communicate with you;\n\n– Screen our orders for potential risk or fraud; and\n\n– When in line with the preferences you have shared with us, provide you with information or advertising relating to our products or services.\n\nWe use the Browsing Information that we collect to help us screen for potential risk and fraud (in particular, your IP address), and more generally to improve and optimize our Site (for example, by generating analytics about how our customers browse and interact with the Site, and to assess the success of our marketing and advertising campaigns).\n\nSHARING YOUR PERSONAL INFORMATION\n\nWe may share Your Personal Information with third parties to help us use Your Personal Information, as described above. For example, we may use Google Analytics to help us understand how our customers use the Site — you can read more about how Google uses your Personal Information here: <a href='https://www.google.com/intl/en/policies/privacy/' target='_blank'>https://www.google.com/intl/en/policies/privacy</a>. You can also opt-out of Google Analytics here: <a href='https://tools.google.com/dlpage/gaoptout' target='_blank'>https://tools.google.com/dlpage/gaoptout</a>.\n\nFinally, we may also share Your Personal Information to comply with applicable laws and regulations, to respond to a subpoena, search warrant or other lawful request for information we receive, or to otherwise protect our rights.\n\nBEHAVIOURAL ADVERTISING\n\nAs described above, we use Your Personal Information to provide you with targeted advertisements or marketing communications we believe may be of interest to you. For more information about how targeted advertising works, you can visit the Network Advertising Initiative’s (“NAI”) educational page at <a href='http://www.networkadvertising.org/understanding-online-advertising/how-does-it-work' target='_blank'>http://www.networkadvertising.org/understanding-online-advertising/how-does-it-work</a> .\n\nYou can opt out of targeted advertising by using the links below:\n\n– Facebook: <a href='https://www.facebook.com/settings/?tab=ads' target='_blank'>https://www.facebook.com/settings/?tab=ads</a>\n\n– Google: <a href='https://www.google.com/settings/ads/anonymous' target='_blank'>https://www.google.com/settings/ads/anonymous</a> \n\n– Bing: <a href='https://advertise.bingads.microsoft.com/en-us/resources/policies/personalized-ads' target='_blank'>https://advertise.bingads.microsoft.com/en-us/resources/policies/personalized-ads</a> \n\nAdditionally, you can opt out of some of these services by visiting the Digital Advertising Alliance’s opt-out portal at: <a href='http://optout.aboutads.info' target='_blank'>http://optout.aboutads.info</a>.\n\nDO NOT TRACK\nPlease note that we presently do not alter our Site’s data collection and use practices when we see a Do Not Track signal from your browser.\n\nYOUR RIGHTS\n\nIf you are a European resident, you have the right to access personal information we hold about you and to ask that your personal information be corrected, updated, or deleted. If you would like to exercise this right, please contact us through the contact information below.\n\nAdditionally, if you are a European resident we note that we are processing your information in order to fulfill contracts we might have with you (for example if you make an order through the Site), or otherwise to pursue our legitimate business interests listed above. Additionally, please note that your information may be transferred outside of Europe, including to Canada and the United States.\n\nDATA RETENTION\n\nWhen you place an order through the Site, we will maintain your Purchase Information for our records unless and until you ask us to delete this information.\n\nCHANGES\n\nWe may update this privacy policy from time to time in order to reflect, for example, changes to our practices or for other operational, legal or regulatory reasons.\n\nMINORS\nThe Site is not intended for individuals under the age of 18.\n\nCONTACT US\nFor more information about our privacy practices, if you have questions, or if you would like to make a complaint, please contact us by e‑mail at the email address provided in the Contact section of the Site","privacyPolicyExampleLastRevised":"Last Revised: 28 June 2022","refundsPolicyExample":"Subject to these terms, we offer refunds on the purchase of goods but not on the provision of services. Our returns period lasts for 14 days after you receive any item. If 14 days have gone by since delivery of your purchase, unfortunately we can’t offer you a refund.\n\nTo be eligible to return an item for a refund, it must be unused and in the same condition that you received it. It must also be in the original packaging. To complete your return, we require a receipt or proof of purchase.\n\nWhere items have been made or personalised for you, they are non-refundable unless defective. Please be sure to confirm all items prior to purchasing.\n\nIf you need to return an item, send us an email at our contact email address on this website and we will provide you with the address to return your items. Once your return is received and inspected, we will send you an email to notify you that we have received your returned item. We will also notify you of the approval or rejection of your refund and will process your refund within seven business days after the returned item is confirmed to be in reasonable condition.\n\nWhen you are returning items, you should consider using a trackable shipping service or purchasing shipping insurance. You will be responsible for paying for your own shipping costs for returning your item. Shipping costs are non-refundable. If you receive a refund, other than for a faulty item, the cost of return shipping will be deducted from your refund.","refundsPolicyExampleLastRevised":"Last Revised: 28 June 2022","refundsPolicyDefault":"Please contact us for our full Refunds & Returns Policy.","refundsPolicyDefaultLastRevised":"Last Revised: 30 August 2022","termsAndConditionsExample":"OVERVIEW\nThis website is operated by the party identified in the Contacts section of the website. Throughout the site, the terms “we”, “us” and “our” refers to them. We offer this website, including all information, tools and services available from this site to you, the user, conditioned upon your acceptance of all terms, conditions, policies and notices stated here.\n\nBy visiting our site and/ or purchasing items(s) or service(s) from us, you engage in our “Service” and agree to be bound by the following terms and conditions (“Terms of Service”, “Terms”), including those additional terms and conditions and policies referenced herein. These Terms of Service apply to all users of the site, including without limitation users who are browsers, vendors
